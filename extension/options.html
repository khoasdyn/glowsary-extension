<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glowsary</title>
    <script src="tokens/color-tokens.js"></script>
    <script src="tokens/semantic-color-tokens.js"></script>
    <script src="tokens/shadow-tokens.js"></script>
    <script src="tokens/typography-tokens.js"></script>
    <script src="tokens/semantic-typography-tokens.js"></script>
    <script src="tokens/radius-tokens.js"></script>
    <link rel="stylesheet" href="text-button.css" />
    <link rel="stylesheet" href="icon-button.css" />
    <link rel="stylesheet" href="tab-nav.css" />
    <link rel="stylesheet" href="switch.css" />
    <link rel="stylesheet" href="color-picker.css" />
    <link rel="stylesheet" href="entry-form.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Welcome to Glowsary!</h1>
      </header>

      <nav class="tab-nav" id="management-tab-nav" role="tablist" aria-label="Management sections">
        <button class="tab-nav__item is-active" id="management-tab-home" type="button" role="tab" aria-selected="true" aria-controls="management-panel-home" data-tab-value="home">
          <span class="tab-nav__icon tab-nav__icon--home" aria-hidden="true"></span>
          <span class="tab-nav__label">Home</span>
        </button>
        <button class="tab-nav__item" id="management-tab-settings" type="button" role="tab" aria-selected="false" aria-controls="management-panel-settings" data-tab-value="settings" tabindex="-1">
          <span class="tab-nav__icon tab-nav__icon--settings" aria-hidden="true"></span>
          <span class="tab-nav__label">Settings</span>
        </button>
      </nav>

      <section class="management-tab-panel" id="management-panel-home" role="tabpanel" aria-labelledby="management-tab-home" data-tab-panel="home">
        <section class="home-section" aria-labelledby="list-heading">
          <header class="home-header">
            <div class="home-title-group">
              <div class="home-title-row">
                <h2 id="list-heading">Saved Words (<span id="entry-count">0</span>)</h2>
              </div>
              <p>Your saved words are highlighted across every site you visit</p>
            </div>
          </header>
          <div class="list-controls">
            <label class="search-field">
              <span class="visually-hidden">Search</span>
              <input id="search-input" type="search" autocomplete="off" placeholder="Search terms" />
            </label>
            <label class="sort-field">
              <span class="visually-hidden">Sort</span>
              <select id="sort-select">
                <option value="latest">Latest added</option>
                <option value="az">A -> Z</option>
              </select>
            </label>
          </div>
          <div class="entry-list" id="entry-list"></div>
          <div class="empty-state grid-empty-state" id="empty-state" hidden>No matching words.</div>
        </section>
      </section>

      <section class="management-tab-panel" id="management-panel-settings" role="tabpanel" aria-labelledby="management-tab-settings" data-tab-panel="settings" hidden>
        <section class="excluded-section" aria-labelledby="excluded-heading">
          <div class="settings-section-header">
            <div class="settings-section-title-group">
              <div class="settings-section-title-row">
                <h2 id="excluded-heading">Excluded Sites (<span id="excluded-count">0</span>)</h2>
              </div>
              <p>Pause highlighting on sites where saved words are noise.</p>
            </div>
          </div>
          <button class="text-button text-button--default excluded-add-button" id="add-excluded-site" type="button">
            <span class="text-button__label">Add New</span>
          </button>
          <div class="excluded-list" id="excluded-list"></div>
        </section>

        <section class="backup-section" aria-labelledby="data-tools-heading">
          <div class="settings-section-header">
            <h2 id="data-tools-heading">Backup Data</h2>
          </div>
          <div class="backup-card-grid">
            <button class="backup-card" id="import-entries" type="button">
              <span class="backup-card__icon backup-card__icon--upload" aria-hidden="true"></span>
              <span class="backup-card__title">Import CSV</span>
              <span class="backup-card__subtitle">Load words from a CSV file</span>
            </button>
            <button class="backup-card" id="export-entries" type="button">
              <span class="backup-card__icon backup-card__icon--download" aria-hidden="true"></span>
              <span class="backup-card__title">Export CSV</span>
              <span class="backup-card__subtitle">Save your words as a CSV file</span>
            </button>
            <input id="import-file" type="file" accept=".csv,text/csv" hidden />
          </div>
        </section>
      </section>

      <div class="editor-layer" id="editor-panel" hidden>
        <section class="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
          <div class="panel-header">
            <h2 id="editor-title">Add Word</h2>
            <button class="editor-close-button" id="close-editor" type="button" aria-label="Close form" title="Close form">
              <span class="editor-close-button__icon" aria-hidden="true"></span>
            </button>
          </div>
          <div id="entry-form-mount"></div>
        </section>
      </div>

      <div class="site-dialog-layer" id="site-dialog" hidden>
        <section class="site-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="site-dialog-title">
          <div class="panel-header">
            <h2 id="site-dialog-title">Add Site</h2>
            <button class="editor-close-button" id="close-site-dialog" type="button" aria-label="Close dialog" title="Close dialog">
              <span class="editor-close-button__icon" aria-hidden="true"></span>
            </button>
          </div>
          <form class="site-dialog-form" id="site-dialog-form">
            <div class="site-dialog-fields">
              <label class="field-input">
                <span class="field-input__label">Site</span>
                <input class="field-input__control" id="site-input" name="site" type="text" autocomplete="off" placeholder="spotify.com" />
                <p class="field-input__hint" id="site-hint"></p>
              </label>
            </div>
            <div class="form-actions">
              <button class="text-button text-button--default" id="save-site" type="submit" disabled>
                <span class="text-button__label">Save</span>
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="domain-utils.js"></script>
    <script src="icon-button.js"></script>
    <script src="speech.js"></script>
    <script src="tab-nav.js"></script>
    <script src="color-picker.js"></script>
    <script src="entry-form.js"></script>
    <script src="options.js"></script>
  </body>
</html>
