<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glowsary</title>
    <script src="tokens/color-tokens.js"></script>
    <script src="tokens/semantic-color-tokens.js"></script>
    <script src="tokens/shadow-tokens.js"></script>
    <script src="tokens/typography-tokens.js"></script>
    <script src="tokens/semantic-typography-tokens.js"></script>
    <link rel="stylesheet" href="text-button.css" />
    <link rel="stylesheet" href="icon-button.css" />
    <link rel="stylesheet" href="switch.css" />
    <link rel="stylesheet" href="tab-nav.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Welcome to Glowsary!</h1>
      </header>

      <nav class="tab-nav" id="management-tab-nav" role="tablist" aria-label="Management sections">
        <button class="tab-nav__item is-active" id="management-tab-home" type="button" role="tab" aria-selected="true" aria-controls="management-panel-home" data-tab-value="home">
          <span class="tab-nav__icon tab-nav__icon--home" aria-hidden="true"></span>
          <span class="tab-nav__label">Home</span>
        </button>
        <button class="tab-nav__item" id="management-tab-settings" type="button" role="tab" aria-selected="false" aria-controls="management-panel-settings" data-tab-value="settings" tabindex="-1">
          <span class="tab-nav__icon tab-nav__icon--settings" aria-hidden="true"></span>
          <span class="tab-nav__label">Settings</span>
        </button>
      </nav>

      <section class="management-tab-panel" id="management-panel-home" role="tabpanel" aria-labelledby="management-tab-home" data-tab-panel="home">
        <section class="settings-panel" aria-label="Highlighting">
          <label class="switch-row">
            <input id="highlighting-enabled" type="checkbox" />
            <span>
              <strong>Highlighting</strong>
              <small>Show saved words on webpages</small>
            </span>
          </label>
        </section>

        <div class="management-home-actions">
          <button class="text-button text-button--default" id="add-entry" type="button"><span class="text-button__label">Add new</span></button>
        </div>

        <section class="list-section" aria-labelledby="list-heading">
          <div class="list-heading-row">
            <h2 id="list-heading">Saved words</h2>
            <div class="list-heading-actions">
              <span id="entry-count">0 entries</span>
              <button class="text-button text-button--secondary" id="export-entries" type="button"><span class="text-button__label">Export</span></button>
              <button class="text-button text-button--secondary" id="import-entries" type="button"><span class="text-button__label">Import</span></button>
              <input id="import-file" type="file" accept=".csv,text/csv" hidden />
            </div>
          </div>
          <div class="list-controls">
            <label class="search-field">
              Search
              <input id="search-input" type="search" autocomplete="off" placeholder="Search terms" />
            </label>
            <label class="sort-field">
              Sort
              <select id="sort-select">
                <option value="latest">Latest added</option>
                <option value="az">A -> Z</option>
              </select>
            </label>
          </div>
          <div class="empty-state" id="empty-state">No words saved yet.</div>
          <div class="entry-list" id="entry-list"></div>
        </section>
      </section>

      <section class="management-tab-panel" id="management-panel-settings" role="tabpanel" aria-labelledby="management-tab-settings" data-tab-panel="settings" hidden>
        <section class="excluded-section" aria-labelledby="excluded-heading">
          <div class="list-heading-row">
            <div>
              <h2 id="excluded-heading">Excluded sites</h2>
              <p>Pause highlighting on sites where saved words are noise.</p>
            </div>
            <span id="excluded-count">0 sites</span>
          </div>
          <label class="switch-row excluded-master">
            <input id="excluded-sites-enabled" type="checkbox" />
            <span>
              <strong>Use excluded sites list</strong>
              <small>When off, highlighting runs everywhere.</small>
            </span>
          </label>
          <form class="excluded-form" id="excluded-form">
            <label class="excluded-field">
              Domain
              <input id="excluded-input" type="text" autocomplete="off" placeholder="spotify.com" />
            </label>
            <button class="text-button text-button--secondary" type="submit"><span class="text-button__label">Exclude site</span></button>
          </form>
          <div class="form-message" id="excluded-message" role="status"></div>
          <div class="empty-state" id="excluded-empty">No sites excluded.</div>
          <div class="excluded-list" id="excluded-list"></div>
        </section>
      </section>

      <div class="modal-backdrop" id="editor-panel" hidden>
        <section class="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
          <div class="panel-header">
            <h2 id="editor-title">Add word</h2>
            <button class="editor-close-button" id="close-editor" type="button" aria-label="Close form">&times;</button>
          </div>
          <form id="entry-form" class="entry-form">
            <label>
              Word
              <input id="term-input" name="term" autocomplete="off" />
            </label>
            <label>
              Definition
              <textarea id="definition-input" name="definition"></textarea>
            </label>
            <label>
              Alias
              <input id="alias-input" name="alias" autocomplete="off" placeholder="versions, versioned" />
            </label>
            <div class="form-message" id="form-message" role="alert"></div>
            <div class="form-actions">
              <button class="text-button text-button--secondary" id="cancel-editor" type="button"><span class="text-button__label">Cancel</span></button>
              <button class="text-button text-button--default" type="submit"><span class="text-button__label">Save</span></button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="domain-utils.js"></script>
    <script src="icon-button.js"></script>
    <script src="tab-nav.js"></script>
    <script src="options.js"></script>
  </body>
</html>
