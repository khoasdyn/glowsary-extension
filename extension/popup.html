<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glowsary</title>
    <script src="tokens/color-tokens.js"></script>
    <script src="tokens/semantic-color-tokens.js"></script>
    <script src="tokens/typography-tokens.js"></script>
    <script src="tokens/semantic-typography-tokens.js"></script>
    <link rel="stylesheet" href="text-button.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>Glowsary</h1>
      </header>

      <label class="switch-row">
        <input id="highlighting-enabled" type="checkbox" />
        <span>
          <strong>Highlighting</strong>
          <small>Show saved words on webpages</small>
        </span>
      </label>

      <fieldset class="trigger-group" id="trigger-group">
        <legend>Reveal definition</legend>
        <label>
          <input type="radio" name="reveal-trigger" value="hover" />
          Hover
        </label>
        <label>
          <input type="radio" name="reveal-trigger" value="click" />
          Click
        </label>
      </fieldset>

      <section class="exclude-panel" aria-label="Excluded site">
        <button class="text-button text-button--secondary" id="exclude-site" type="button"><span class="text-button__label">Exclude this site</span></button>
        <div class="popup-message" id="exclude-message" role="status"></div>
      </section>

      <button class="text-button text-button--default" id="open-settings" type="button"><span class="text-button__label">Settings</span></button>
    </main>

    <script src="domain-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
