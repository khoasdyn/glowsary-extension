<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glowsary</title>
    <script src="tokens/color-tokens.js"></script>
    <script src="tokens/semantic-color-tokens.js"></script>
    <script src="tokens/shadow-tokens.js"></script>
    <script src="tokens/typography-tokens.js"></script>
    <script src="tokens/semantic-typography-tokens.js"></script>
    <script src="tokens/radius-tokens.js"></script>
    <link rel="stylesheet" href="text-button.css" />
    <link rel="stylesheet" href="switch.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="popup-main" aria-live="polite">
        <div class="popup-status">
          <h1 class="popup-status__title" id="popup-status-title">Extension is active</h1>
          <p class="popup-status__subtitle" id="popup-status-subtitle">Show saved words on webpages</p>
        </div>

        <label class="glowsary-switch-row popup-switch" aria-label="Highlighting">
          <input id="highlighting-enabled" type="checkbox" />
        </label>
      </section>

      <footer class="popup-footer">
        <button class="text-button text-button--default popup-app-button" id="go-to-app" type="button">
          <span class="text-button__label">Go To App</span>
        </button>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
